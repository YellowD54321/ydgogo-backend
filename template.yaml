AWSTemplateFormatVersion: 2010-09-09
Description: >-
  ydgogo
Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: API Gateway deployment stage
  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID
    NoEcho: true
    Default: ''
  JwtSecret:
    Type: String
    Description: JWT Secret Key for token signing
    NoEcho: true
    Default: ''
  DomainName:
    Type: String
    Default: ''
    Description: Custom domain name for API Gateway (e.g. api.go-garret.com)
  HostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 Hosted Zone ID for the domain

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, '']]

Resources:
  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  YdgogoApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      TracingEnabled: true
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"

  ApiCustomDomain:
    Type: AWS::ApiGateway::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      RegionalCertificateArn: !Ref ApiCertificate
      EndpointConfiguration:
        Types:
          - REGIONAL

  ApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Condition: HasCustomDomain
    DependsOn: YdgogoApiStage
    Properties:
      DomainName: !Ref ApiCustomDomain
      RestApiId: !Ref YdgogoApi
      Stage: !Ref Stage

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiCustomDomain.RegionalHostedZoneId

  # DynamoDB 資料表 - 單表設計
  YdgogoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-${Stage}-ydgogo'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: googleSub
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byGoogleSub-gsi
          KeySchema:
            - AttributeName: googleSub
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Stage
        - Key: Project
          Value: ydgogo

  googleLoginFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true
        EntryPoints:
          - src/handlers/login/googleLogin/googleLogin.ts
    Properties:
      CodeUri: .
      Handler: dist/handlers/login/googleLogin/googleLogin.googleLoginHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Google OAuth login handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref YdgogoApi
            Path: /login/googleOauth
            Method: POST
      Environment:
        Variables:
          NODE_OPTIONS: '--enable-source-maps'
          TABLE_NAME: !Ref YdgogoTable
          GSI_GOOGLE_SUB_NAME: 'byGoogleSub-gsi'
          STAGE: !Ref Stage
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_ID_PARAM: '/ydgogo/google-client-id'
          JWT_SECRET: !Ref JwtSecret
          JWT_SECRET_PARAM: '/ydgogo/jwt-secret'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YdgogoTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
              Resource:
                - !GetAtt YdgogoTable.Arn
                - !Sub '${YdgogoTable.Arn}/index/*'
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ydgogo/*'

  googleRegisterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true
        EntryPoints:
          - src/handlers/register/googleRegister/googleRegister.ts
    Properties:
      CodeUri: .
      Handler: dist/handlers/register/googleRegister/googleRegister.googleRegisterHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Google OAuth register handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref YdgogoApi
            Path: /register/googleOauth
            Method: POST
      Environment:
        Variables:
          NODE_OPTIONS: '--enable-source-maps'
          TABLE_NAME: !Ref YdgogoTable
          GSI_GOOGLE_SUB_NAME: 'byGoogleSub-gsi'
          STAGE: !Ref Stage
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_ID_PARAM: '/ydgogo/google-client-id'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YdgogoTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
                - dynamodb:BatchWriteItem
              Resource:
                - !GetAtt YdgogoTable.Arn
                - !Sub '${YdgogoTable.Arn}/index/*'
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ydgogo/*'

  # Records CRUD Lambda Functions
  listRecordsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true
        EntryPoints:
          - src/handlers/records/listRecords.ts
    Properties:
      CodeUri: .
      Handler: dist/handlers/records/listRecords.listRecordsHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: List records handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref YdgogoApi
            Path: /records
            Method: GET
      Environment:
        Variables:
          NODE_OPTIONS: '--enable-source-maps'
          TABLE_NAME: !Ref YdgogoTable
          STAGE: !Ref Stage
          JWT_SECRET: !Ref JwtSecret
          JWT_SECRET_PARAM: '/ydgogo/jwt-secret'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YdgogoTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt YdgogoTable.Arn
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ydgogo/*'

  getRecordFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true
        EntryPoints:
          - src/handlers/records/getRecord.ts
    Properties:
      CodeUri: .
      Handler: dist/handlers/records/getRecord.getRecordHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Get single record handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref YdgogoApi
            Path: /records/{recordId}
            Method: GET
      Environment:
        Variables:
          NODE_OPTIONS: '--enable-source-maps'
          TABLE_NAME: !Ref YdgogoTable
          STAGE: !Ref Stage
          JWT_SECRET: !Ref JwtSecret
          JWT_SECRET_PARAM: '/ydgogo/jwt-secret'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YdgogoTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !GetAtt YdgogoTable.Arn
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ydgogo/*'

  createRecordFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true
        EntryPoints:
          - src/handlers/records/createRecord.ts
    Properties:
      CodeUri: .
      Handler: dist/handlers/records/createRecord.createRecordHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Create record handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref YdgogoApi
            Path: /records
            Method: POST
      Environment:
        Variables:
          NODE_OPTIONS: '--enable-source-maps'
          TABLE_NAME: !Ref YdgogoTable
          STAGE: !Ref Stage
          JWT_SECRET: !Ref JwtSecret
          JWT_SECRET_PARAM: '/ydgogo/jwt-secret'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YdgogoTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !GetAtt YdgogoTable.Arn
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ydgogo/*'

  updateRecordFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true
        EntryPoints:
          - src/handlers/records/updateRecord.ts
    Properties:
      CodeUri: .
      Handler: dist/handlers/records/updateRecord.updateRecordHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Update record handler
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref YdgogoApi
            Path: /records/{recordId}
            Method: PUT
      Environment:
        Variables:
          NODE_OPTIONS: '--enable-source-maps'
          TABLE_NAME: !Ref YdgogoTable
          STAGE: !Ref Stage
          JWT_SECRET: !Ref JwtSecret
          JWT_SECRET_PARAM: '/ydgogo/jwt-secret'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YdgogoTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt YdgogoTable.Arn
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ydgogo/*'

  deleteRecordFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2020'
        Sourcemap: true
        EntryPoints:
          - src/handlers/records/deleteRecord.ts
    Properties:
      CodeUri: .
      Handler: dist/handlers/records/deleteRecord.deleteRecordHandler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Delete record handler (soft delete)
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref YdgogoApi
            Path: /records/{recordId}
            Method: DELETE
      Environment:
        Variables:
          NODE_OPTIONS: '--enable-source-maps'
          TABLE_NAME: !Ref YdgogoTable
          STAGE: !Ref Stage
          JWT_SECRET: !Ref JwtSecret
          JWT_SECRET_PARAM: '/ydgogo/jwt-secret'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref YdgogoTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt YdgogoTable.Arn
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ydgogo/*'

  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name:
        Fn::Sub: ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName:
        Ref: ApplicationResourceGroup
      AutoConfigurationEnabled: 'true'

Outputs:
  WebEndpoint:
    Description: API Gateway endpoint URL for deployment stage
    Value: !Sub 'https://${YdgogoApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/'

  CustomDomainEndpoint:
    Condition: HasCustomDomain
    Description: Custom domain endpoint URL
    Value: !Sub 'https://${DomainName}/'

  YdgogoTableName:
    Description: Name of the DynamoDB table for all data
    Value: !Ref YdgogoTable
    Export:
      Name: !Sub '${AWS::StackName}-${Stage}-YdgogoTable'

Globals:
  Function:
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
